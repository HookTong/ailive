<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <title>AI Live2D Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- 首帧之前就把主题定下来：浅色系统里先闪一帧深色很扎眼。
         之后由 ThemeProvider 接管（它读的是同一个键，解析结果一致） -->
    <script>
      try {
        var mode = localStorage.getItem('ailive.theme')
        var dark = mode === 'dark' || ((!mode || mode === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <script src="/live2d.min.js"></script>
    <script src="/live2dcubismcore.min.js"></script>
    <script src="/vendor/particles.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
